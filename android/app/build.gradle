plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.musicshare.mvp'
    // Platform on disk is android-37.0 (base SDK, API level 37.0).
    compileSdk 37
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.musicshare.mvp"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Sole external dependency. Java-WebSocket provides BOTH the WS client and
    // server over raw sockets, so Android's cleartext-traffic policy does not apply.
    // NOTE: 1.7.0 does not exist on Maven Central (latest published is 1.6.0).
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'
}
